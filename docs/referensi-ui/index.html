 if(!m||!p){x.textContent='Email dan kata sandi wajib diisi.';return}

 const r=m.startsWith('admin')?'admin':/^(pembimbing|rizal|sinta)/.test(m)?'pembimbing':'peserta';
 S.u={email:m.includes('@')?m:m+'@astakira.id',name:{peserta:ME,pembimbing:'Rizal Hakim',admin:'Admin Astakira'}[r]};S.role=r;S.pg='dash';render();toast('Selamat datang, '+S.u.name,'ok')},

 if(p[0]!='ASTK'||p.length<5||!x)s={err:'inv'};
 else if(Date.now()-+p[3]>30000)s={err:'exp'};
 else if(x.pb!='Rizal Hakim')s={err:'bb',n:x.n};

 else{const w=JW();s={n:x.n,mode:p[2],t:hhmm(),st:p[2]=='masuk'&&mins()>+w[1].slice(0,2)*60+ +w[1].slice(3)+w[3]?'Terlambat':'Hadir'}}
 S.sc=s;render()},

 S.sc=null;render()},ca(){S.al=null;render()},

rv(id){const j=D.jur.find(x=>x.id==id),can=j.s=='Dikirim';A.mo(`<h2>${e(j.j)}</h2><p class="mu">${e(j.ps)}, ${fmt(j.t)} ${badge(j.s)}</p>${det(j)}${can?`<label>Catatan revisi (wajib jika meminta revisi)<textarea id="cat" rows="3"></textarea></label><p class="er-t" id="merr"></p><div class="row"><button class="btn gh" onclick="A.mc()">Tutup</button><button class="btn dg2" onclick="A.dec(${id},0)">Minta revisi</button><button class="btn" onclick="A.dec(${id},1)">Setujui</button></div>`:`${j.c?`<div class="al wa"><b>Catatan revisi</b><p>${e(j.c)}</p></div>`:''}<div class="row"><button class="btn gh" onclick="A.mc()">Tutup</button></div>`}`)},
dec(id,a){const j=D.jur.find(x=>x.id==id),c=$('#cat').value.trim();if(!a&&!c){$('#merr').textContent='Tulis alasan revisi agar peserta tahu bagian yang perlu diperbaiki.';return}if(!net())return;j.s=a?'Disetujui':'Revisi';j.c=a?'':c;lg((a?'Setujui':'Minta revisi')+' jurnal: '+j.j);A.mc();toast(a?'Jurnal disetujui':'Permintaan revisi dikirim','ok');render()},
cf(k,id,vw){const r=id?D[k].find(x=>x.id==id):{n:'',a:'',dv:'',pb:D.pem[0].n,on:1},d=vw?'disabled':'';A.mo(`<h2>${vw?'Detail':id?'Edit':'Tambah'} ${KD[k]}</h2><label>Nama<input id="c1" value="${e(r.n)}" ${d}></label><label>Akun email<input id="c2" value="${e(r.a)}" ${d}></label><label>Divisi<input id="c3" value="${e(r.dv)}" ${d}></label>${k=='pes'?`<label>Pembimbing<select id="c4" ${d}>${D.pem.map(p=>`<option ${p.n==r.pb?'selected':''}>${e(p.n)}</option>`).join('')}</select></label>`:''}<label>Status<select id="c5" ${d}><option value="1" ${r.on?'selected':''}>Aktif</option><option value="0" ${r.on?'':'selected'}>Nonaktif</option></select></label><p class="er-t" id="merr"></p><div class="row"><button class="btn gh" onclick="A.mc()">${vw?'Tutup':'Batal'}</button>${vw?'':`<button class="btn" onclick="A.cs('${k}',${id||0})">Simpan</button>`}</div>`)},
cs(k,id){const n=$('#c1').value.trim(),a=$('#c2').value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(a)){$('#merr').textContent='Isi nama dan email akun yang valid.';return}if(!net())return;const o={n,a,dv:$('#c3').value.trim(),on:+$('#c5').value};if(k=='pes')o.pb=$('#c4').value;if(id)Object.assign(D[k].find(x=>x.id==id),o);else D[k].push({id:Date.now(),...o});lg((id?'Ubah ':'Tambah ')+KD[k]+': '+n);A.mc();toast('Data disimpan','ok');render()},
cx(k,id){const r=D[k].find(x=>x.id==id);A.mo(`<h2>Hapus ${KD[k]}?</h2><p>${e(r.n)} akan dihapus dari daftar dan tindakan ini tercatat di audit log.</p><div class="row"><button class="btn gh" onclick="A.mc()">Batal</button><button class="btn dg2" onclick="A.cdo('${k}',${id})">Hapus</button></div>`)},
cdo(k,id){if(!net())return;const r=D[k].find(x=>x.id==id);D[k]=D[k].filter(x=>x.id!=id);lg('Hapus '+KD[k]+': '+r.n);A.mc();toast('Data dihapus','ok');render()},
sj(){const rows=D.jad.map((r,i)=>[r[0],$('#j'+i+'a').value,$('#j'+i+'b').value,+$('#j'+i+'t').value,$('#j'+i+'k').checked?1:0]);
 const bad=rows.find(r=>r[4]&&(!r[1]||!r[2]||r[2]<=r[1]||r[3]<0));if(bad){toast('Jam pulang '+bad[0]+' harus setelah jam masuk dan toleransi tidak boleh negatif.','warn');return}
 if(!net())return;D.jad=rows;lg('Ubah jadwal workshift');toast('Jadwal disimpan','ok')},
ex(t){if(!net())return;lg('Export laporan '+t);toast('Export '+t+' dimulai (simulasi, belum ada file dibuat)','ok')},
ph(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.av=r.result;toast('Foto profil diperbarui','ok');render()};r.readAsDataURL(f)},
pw(){const a=$('#p0').value,b=$('#p1').value,c=$('#p2').value,m=$('#merr');if(a!=PW){m.textContent='Kata sandi saat ini salah.';return}if(b.length<8){m.textContent='Kata sandi baru minimal 8 karakter.';return}if(b!=c){m.textContent='Ulangi kata sandi baru dengan teks yang sama.';return}if(!net())return;PW=b;['p0','p1','p2'].forEach(x=>$('#'+x).value='');m.textContent='';toast('Kata sandi diubah','ok')}
};
addEventListener('offline',()=>{S.off=true;toast('Koneksi internet terputus','warn');render()});
addEventListener('online',()=>{S.off=false;toast('Koneksi kembali tersambung','ok');render()});
addEventListener('keydown',ev=>{if(ev.key=='Escape')A.mc()});
setInterval(A.tk,1000);
render();
</script></body></html>
